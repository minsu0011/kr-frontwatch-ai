services:
  - type: web
    name: kr-frontwatch-ai
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
